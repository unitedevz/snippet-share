<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>snippet-share — Browse code</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin:0; height:100vh; display:flex; }
    #sidebar { width:340px; border-right:1px solid #e6e6e6; padding:18px; overflow:auto; box-sizing:border-box; }
    #main { flex:1; display:flex; flex-direction:column; }
    header { padding:14px 18px; border-bottom:1px solid #eee; }
    #fileList { margin-top:10px; }
    .file { padding:8px 10px; border-radius:6px; cursor:pointer; margin-bottom:4px; font-size:13px; }
    .file:hover { background:#f6f8fa; }
    .dir { font-weight:600; color:#0366d6; }
    #viewer { padding:18px; overflow:auto; }
    pre { background:#f6f8fa; padding:16px; border-radius:6px; overflow:auto; }
    .meta { font-size:13px; color:#666; margin-bottom:8px; }
    #loading { color:#666; font-size:13px; }
    .small { font-size:12px; color:#888; margin-left:8px; }
    a.raw { margin-left:12px; font-size:12px; }
  </style>
</head>
<body>
  <div id="sidebar">
    <header>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <strong>snippet-share</strong>
          <div class="small">Browse repository files</div>
        </div>
        <div id="branchName" class="small">branch: ...</div>
      </div>
    </header>

    <div id="loading">Loading file tree…</div>
    <div id="fileList" aria-live="polite"></div>
  </div>

  <div id="main">
    <div id="viewer">
      <div class="meta" id="fileMeta">Select a file to view</div>
      <pre><code id="codeBlock" class="hljs"></code></pre>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script>
    // Configuration: change owner/repo if you fork
    const OWNER = 'unitedevz';
    const REPO = 'snippet-share';
    const EXCLUDE_PATHS = ['docs/', '.github/'];

    // Utility helpers
    const el = id => document.getElementById(id);
    const escapeHtml = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function apiGET(path) {
      const url = `https://api.github.com${path}`;
      const r = await fetch(url);
      if (!r.ok) throw new Error(`GitHub API error ${r.status} ${r.statusText} when fetching ${url}`);
      return r.json();
    }

    async function loadDefaultBranch() {
      const repo = await apiGET(`/repos/${OWNER}/${REPO}`);
      return repo.default_branch || 'main';
    }

    function isTextFile(path) {
      // basic extension filter — adjust if needed
      return /\.(js|ts|jsx|tsx|py|java|rb|go|rs|html|css|scss|md|css|json|yml|yaml|sh|Dockerfile|Makefile|txt)$/i.test(path)
        || path.endsWith('README') || path.endsWith('LICENSE');
    }

    function shouldExclude(path) {
      return EXCLUDE_PATHS.some(p => path.startsWith(p));
    }

    async function loadTree(branch) {
      // Use git trees recursive to get file list
      const json = await apiGET(`/repos/${OWNER}/${REPO}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
      if (!json.tree) throw new Error('Invalid tree response');
      return json.tree;
    }

    function buildFileList(tree) {
      const container = el('fileList');
      container.innerHTML = '';
      const files = tree
        .filter(item => item.type === 'blob')
        .map(item => item.path)
        .filter(p => !shouldExclude(p) && isTextFile(p))
        .sort((a,b) => a.localeCompare(b, undefined, {sensitivity:'base'}));

      if (files.length === 0) {
        container.innerHTML = '<div class="small">No viewable code files found.</div>';
        return;
      }

      files.forEach(path => {
        const div = document.createElement('div');
        div.className = 'file';
        div.innerHTML = `<span class="filename">${escapeHtml(path)}</span>`;
        div.onclick = () => showFile(path);
        container.appendChild(div);
      });
    }

    async function showFile(path) {
      el('fileMeta').textContent = `Loading ${path}…`;
      el('codeBlock').textContent = '';
      try {
        const branch = el('branchName').dataset.branch;
        const rawUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${encodeURIComponent(branch)}/${path}`;
        const r = await fetch(rawUrl);
        if (!r.ok) {
          el('fileMeta').textContent = `Failed to fetch ${path}: ${r.status}`;
          return;
        }
        const text = await r.text();
        el('fileMeta').innerHTML = `<strong>${escapeHtml(path)}</strong> <a class="raw" href="${rawUrl}" target="_blank" rel="noopener">raw</a>`;
        const codeEl = el('codeBlock');
        codeEl.textContent = text;
        // try to set a language class based on extension for highlight.js hinting
        const ext = (path.match(/\.([^.]+)$/) || [null,''])[1].toLowerCase();
        codeEl.className = 'hljs';
        // highlight.js auto-detect works well; call it
        hljs.highlightElement(codeEl);
      } catch (err) {
        el('fileMeta').textContent = 'Error loading file: ' + err.message;
      }
    }

    (async function init() {
      try {
        const branch = await loadDefaultBranch();
        el('branchName').textContent = 'branch: ' + branch;
        el('branchName').dataset.branch = branch;

        const tree = await loadTree(branch);
        el('loading').style.display = 'none';
        buildFileList(tree);
      } catch (err) {
        el('loading').textContent = 'Failed to load repository contents: ' + err.message + '.';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
