name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            yarn install
          else
            npm install
          fi

      - name: Build (if applicable)
        run: |
          if [ -f package.json ]; then
            if grep -q '"build"' package.json; then
              if [ -f yarn.lock ]; then
                yarn build || true
              else
                npm run build || true
              fi
            else
              echo "No build script found; skipping build"
            fi
          fi

      - name: Ensure docs directory exists
        run: |
          # If your project outputs static files to a different folder (eg. dist), copy them into docs here.
          if [ -d docs ]; then
            echo "Using existing docs/ directory"
          else
            mkdir -p docs
            echo "Created empty docs/ — add your static site files to docs/ or update the workflow to use the correct output folder." > docs/index.html
          fi

      - name: Upload Pages artifact
  uses: actions/upload-pages-artifact@v2
  with:
    path: ./docs

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2
