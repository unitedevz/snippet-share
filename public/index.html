<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>snippet-share</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">snippet-share</span>
    <span class="tagline">paste it, share the link, done</span>
  </header>

  <form id="pasteForm">
    <textarea id="content" placeholder="Paste your text or code here…" spellcheck="false" required></textarea>

    <div class="controls">
      <label>
        Language label
        <input id="language" type="text" placeholder="text, js, python…" />
      </label>

      <label>
        Expires
        <select id="expiresIn">
          <option value="never">Never</option>
          <option value="10m">10 minutes</option>
          <option value="1h">1 hour</option>
          <option value="1d">1 day</option>
          <option value="7d">7 days</option>
        </select>
      </label>

      <label class="checkbox">
        <input id="burnAfterRead" type="checkbox" />
        Burn after first read
      </label>
    </div>

    <button type="submit">Create paste</button>
  </form>

  <div id="result" class="result hidden">
    <span>Link ready:</span>
    <a id="resultLink" href="#" target="_blank"></a>
    <button id="copyResult">Copy</button>
  </div>

  <p class="cli-hint">Prefer the terminal? <code>cat file.txt | node cli/pastebin.js</code></p>
</div>

<script src="/app.js"></script>
</body>
</html>
