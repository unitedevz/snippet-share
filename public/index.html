<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>snippet-share</title>
<link rel="stylesheet" href="/style.css" />
<script>
  // Applied before paint to avoid a flash of the wrong theme.
  (function () {
    const saved = localStorage.getItem('theme');
    const theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">snippet-share</span>
    <div class="header-actions">
      <span class="tagline">paste it, share the link, done</span>
      <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌓</button>
    </div>
  </header>

  <form id="pasteForm">
    <div class="dropzone" id="dropzone">
      <textarea id="content" placeholder="Paste your text or code here… (or drag a file in)" spellcheck="false" required></textarea>
      <p class="dropzone-hint">Drop a file here to load it, or paste directly.</p>
      <div class="stats">
        <span id="charCount">0 characters</span>
        <span id="lineCount">0 lines</span>
      </div>
    </div>

    <div class="controls">
      <label>
        Language
        <select id="language">
          <option value="auto" selected>Auto-detect</option>
          <option value="text">Plain text</option>
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
          <option value="python">Python</option>
          <option value="go">Go</option>
          <option value="java">Java</option>
          <option value="kotlin">Kotlin</option>
          <option value="rust">Rust</option>
          <option value="c">C</option>
          <option value="cpp">C++</option>
          <option value="csharp">C#</option>
          <option value="php">PHP</option>
          <option value="ruby">Ruby</option>
          <option value="bash">Bash / Shell</option>
          <option value="json">JSON</option>
          <option value="yaml">YAML</option>
          <option value="markdown">Markdown</option>
          <option value="sql">SQL</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
        </select>
      </label>

      <label>
        Expires
        <select id="expiresIn">
          <option value="never">Never</option>
          <option value="10m">10 minutes</option>
          <option value="1h">1 hour</option>
          <option value="1d">1 day</option>
          <option value="7d">7 days</option>
        </select>
      </label>

      <label class="checkbox">
        <input id="burnAfterRead" type="checkbox" />
        Burn after first read
      </label>

      <label>
        Password (optional)
        <input id="password" type="password" placeholder="Leave blank for no password" autocomplete="new-password" />
      </label>
    </div>

    <button type="submit">Create paste</button>
  </form>

  <div id="result" class="result hidden">
    <span>Link ready:</span>
    <a id="resultLink" href="#" target="_blank"></a>
    <button id="copyResult">Copy</button>
    <button id="deleteResult" class="danger">Delete now</button>
    <span id="deleteStatus" class="delete-status"></span>
  </div>

  <p class="cli-hint">Prefer the terminal? <code>cat file.txt | node cli/pastebin.js</code></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
